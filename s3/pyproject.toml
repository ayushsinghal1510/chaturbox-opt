[project]
name = "s3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.12.0",
    "conformer>=0.3.2",
    "diffusers>=0.36.0",
    "librosa>=0.11.0",
    "peft>=0.18.1",
    "pyyaml>=6.0.3",
    "s3tokenizer>=0.3.0",
    "torch>=2.10.0",
    "torchaudio>=2.10.0",
    "torchcodec>=0.10.0",
]

[project.scripts]
s3 = "s3.app:main"
s3tokenizer = "s3.tests.s3tokenizer_:main"
s3tokenizer_streaming = "s3.tests.s3tokenizer_streaming_:main"
s3gen_streaming = "s3.tests.s3gen_streaming_:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
