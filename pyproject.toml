[project]
name = "chaturbox-opt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
]

[project.scripts]
chaturbox-opt = "chaturbox_opt:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "s3",
    "s3tokenizers",
    "s3gen",
    "modules",
    "t3tokenizers"
]

[tool.uv.sources]
s3 = { workspace = true }
s3tokenizers = { workspace = true }
